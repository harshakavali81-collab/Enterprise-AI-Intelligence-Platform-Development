name: Ten synthetic AI/ML demos — smoke tests
on:
  push:
    paths:
      - 'ten-ml-projects-2026/**'
      - '.github/workflows/ten-ml-projects-ci.yml'
  pull_request:
    paths:
      - 'ten-ml-projects-2026/**'
      - '.github/workflows/ten-ml-projects-ci.yml'
  workflow_dispatch:
jobs:
  test-ten-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install shared project requirements
        run: pip install -r ten-ml-projects-2026/01-real-time-fraud-detection-and-risk-scoring-platform/requirements.txt
      - name: Run all ten model training smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for dir in ten-ml-projects-2026/[0-9][0-9]-*; do
            echo "::group::$(basename "$dir")"
            (cd "$dir" && python -m unittest discover -s tests -v)
            echo "::endgroup::"
          done

name: Public Benefit AI synthetic demo CI
on:
  push:
    paths:
      - 'public-benefit-ai/**'
      - '.github/workflows/public-benefit-ai.yml'
  pull_request:
    paths:
      - 'public-benefit-ai/**'
      - '.github/workflows/public-benefit-ai.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-benefit-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: public-benefit-ai/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Deterministic synthetic evaluation
        run: python -m scripts.evaluate
      - name: Measure models against tiny synthetic baselines
        run: python -m scripts.evaluate_models
      - name: Audit ten project document and graphic bundles
        run: python -m scripts.audit_assets
      - name: Verify all standalone export folders can be generated
        run: |
          python scripts/export_standalone.py --replace
          test "$(find dist/independent-repositories -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 10
      - name: Compile all exported Python code
        run: python -m compileall -q dist/independent-repositories
      - name: Upload transparent synthetic evaluation report and chart
        uses: actions/upload-artifact@v4
        with:
          name: public-benefit-ai-synthetic-metrics
          path: public-benefit-ai/reports/
          retention-days: 14
          if-no-files-found: error
      - name: Upload ten independent repository source packages
        uses: actions/upload-artifact@v4
        with:
          name: ten-github-ready-repositories
          path: public-benefit-ai/dist/independent-repositories/
          retention-days: 14
          if-no-files-found: error
